# Tests on every OS, then builds the standalone apps.
# Pull requests and manual runs keep the builds as workflow artifacts;
# publishing a GitHub release also attaches them to that release.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc, so the binary runs on more distros
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("lantern.py").read()).group(1))')" >> "$GITHUB_OUTPUT"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
          python3 -m venv .venv && source .venv/bin/activate
          ./build.sh
          mkdir out && cp dist/Lantern "out/Lantern-${{ steps.version.outputs.version }}-${{ matrix.name }}"

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ./build.sh
          ./create_dmg.sh
          mkdir out && cp "dist/Lantern-${{ steps.version.outputs.version }}.dmg" "out/Lantern-${{ steps.version.outputs.version }}-${{ matrix.name }}.dmg"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller zeroconf
          python -m PyInstaller --name Lantern --windowed --onefile --clean --noconfirm --collect-submodules zeroconf --add-data "assets;assets" --icon assets\lantern.ico lantern.py
          mkdir out
          copy dist\Lantern.exe "out\Lantern-${{ steps.version.outputs.version }}-${{ matrix.name }}.exe"
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
