<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A48"/>
      <stop offset="1" stop-color="#0E1424"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="290" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FF9A1F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF9A1F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="256" cy="300" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="0.35" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F08A12"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4566"/>
      <stop offset="1" stop-color="#252E4A"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="210" fill="url(#halo)"/>

  <!-- network rings radiating from the light -->
  <g fill="none" stroke="#FFC46B" stroke-linecap="round" stroke-width="10">
    <path d="M118 210 A160 160 0 0 0 118 370" opacity="0.35"/>
    <path d="M394 210 A160 160 0 0 1 394 370" opacity="0.35"/>
    <path d="M80 180 A205 205 0 0 0 80 400" opacity="0.18"/>
    <path d="M432 180 A205 205 0 0 1 432 400" opacity="0.18"/>
  </g>

  <!-- handle -->
  <path d="M216 150 A40 40 0 0 1 296 150" fill="none" stroke="#5A6890" stroke-width="16" stroke-linecap="round"/>
  <!-- cap -->
  <path d="M196 196 L210 160 H302 L316 196 Z" fill="url(#metal)"/>
  <rect x="180" y="192" width="152" height="22" rx="11" fill="#46537A"/>
  <!-- glass body -->
  <path d="M196 214 H316 C330 260 330 340 316 386 H196 C182 340 182 260 196 214 Z" fill="url(#glass)"/>
  <!-- frame bars -->
  <g stroke="#2A3352" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M226 218 C220 270 220 330 226 382"/>
    <path d="M286 218 C292 270 292 330 286 382"/>
  </g>
  <!-- flame -->
  <path d="M256 250 C276 278 282 300 270 320 C264 331 248 331 242 320 C230 300 238 278 256 250 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- base -->
  <rect x="180" y="384" width="152" height="24" rx="12" fill="#46537A"/>
  <path d="M206 408 H306 L296 426 H216 Z" fill="url(#metal)"/>
</svg>
